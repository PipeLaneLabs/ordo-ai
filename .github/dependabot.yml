version: 2
updates:
  # 📦 Python dependencies (Poetry)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop" # Updates go to Alpha tier first
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Etc/UTC" # Good practice to be explicit
    groups:
      # Groups all python updates into a single PR to reduce noise
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      include: "scope"

  # 🤖 GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"  # FIXED: Added closing quote
      day: "saturday"
      time: "00:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "fix"