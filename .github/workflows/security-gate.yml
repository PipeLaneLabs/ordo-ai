# ==========================================================
# 🛡️ SECURITY GATE (The PR Blocker)
# ==========================================================
name: Security Gate (PR Blocker)
on:
  pull_request:
    branches: [main, staging, develop]
    types: [opened, synchronize, reopened] # Runs when PR is made or updated
  workflow_dispatch: # --- ADDED: MANUAL TRIGGER ---

permissions:
  contents: read
  pull-requests: write
  security-events: write # Required for CodeQL/Bandit reporting

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    name: Dependency Review (Vulnerabilities + Licenses)
    
    steps:
      - uses: actions/checkout@v4
        with:
          # CRITICAL FIX 1: Fetch full history so the action can compare commits
          fetch-depth: 0 
      
      - name: Dependency Review Action
        uses: actions/dependency-review-action@v4
        with:
          config-file: './.github/dependency-review-config.yml'
          fail-on-severity: high
          # -------------------------------------------------------
          # FIX: Explicitly set refs based on the trigger type
          # -------------------------------------------------------
          # If PR: Use the PR's base. If Manual: Use the previous commit (HEAD^1)
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}
          
          # If PR: Use the PR's head. If Manual: Use the current commit (HEAD)
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}

  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Scanning (TruffleHog)
    
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan only the PR changes (not full history for speed)
          fetch-depth: 0
      
      - name: TruffleHog OSS Secret Scanner
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          # CRITICAL FIX 2: Handle Manual Trigger (workflow_dispatch)
          # We apply the same logic as dependency-review to prevent crashing when 'pull_request' is null
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          
          # Only fail on verified secrets (reduces false positives)
          extra_args: --only-verified

  codeql-analysis:
    runs-on: ubuntu-latest
    name: CodeQL Security Analysis
    
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use the default query suite (includes security queries)
          queries: security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"