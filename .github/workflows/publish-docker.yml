name: Publish to GHCR

on:
  release:
    types: [published]
  workflow_dispatch: # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # FIX 1: Set up Buildx (Required for Caching)
      # ----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # FIX 2: Correct Tagging Logic
      # ----------------------------------------------------------------
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semver tags for releases (v1.0.0, v1.0, v1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # SHA tag for every build (good for traceability)
            type=sha
            # 'latest' tag only for actual Releases (Industry Standard)
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            # Optional: Add a 'manual' tag for manual runs if you need to test
            type=raw,value=manual-test,enable=${{ github.event_name == 'workflow_dispatch' }}

      # ----------------------------------------------------------------
      # FIX 3: Enable Caching & Pass Args Correctly
      # ----------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions Cache (Speed up builds by 5-10x)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            # Ensure your Dockerfile has: ARG POETRY_DYNAMIC_VERSIONING_BYPASS
            POETRY_DYNAMIC_VERSIONING_BYPASS=${{ github.ref_name }}