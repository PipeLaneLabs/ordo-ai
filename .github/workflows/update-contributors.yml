name: Update Contributors

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-contributors:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update contributors
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/update_contributors.py --readme README.md

      - name: Check for changes
        id: check
        run: git diff --quiet README.md || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="update-contributors-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"

          git add README.md
          git commit -m "chore: update contributors list"

          git push -u origin "$BRANCH_NAME"

          gh pr create \
            --title "chore: update contributors list" \
            --body-file - \
            --label "documentation" \
            --label "automated" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH_NAME" <<'EOF'
## Automated Contributors Update

This PR automatically updates the contributors list based on recent activity.

Generated by the daily contributors update workflow.
EOF