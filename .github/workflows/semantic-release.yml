# ==========================================================
# 🚀 SEMANTIC RELEASE (Three-Tier Versioning)
# ==========================================================
# Runs on push to main/staging/develop and creates:
# - main: v1.0.0 (Production)
# - staging: v1.0.0-beta.1 (Beta)
# - develop: v1.0.0-alpha.1 (Alpha)
# ==========================================================
name: Semantic Release

on:
  push:
    branches:
      - main
      - staging
      - develop

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      
      # 1. MODERN CACHING
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 2.3.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # We still need the plugin installed in Poetry's CLI context
          $HOME/.local/bin/poetry self add "poetry-dynamic-versioning[plugin]"
      
      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      # 2. INSTALL FROM LOCK FILE (Safer than pip install)
      - name: Install dependencies
        run: poetry install --no-root --with dev
      
      - name: Python Semantic Release
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config user.name "ordo-ai-factory-bot[bot]"
          git config user.email "ordo-ai-factory-bot[bot]@users.noreply.github.com"
          
          # 3. RUN VIA POETRY (Uses the locked version)
          poetry run semantic-release version
          poetry run semantic-release publish