repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.2.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        # NO ARGS. Let pyproject.toml handle it.

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]

  # USE LOCAL TO ACCESS POETRY DEPENDENCIES
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false # Keep this FALSE for safety, change to TRUE only if it gets too slow.